<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>すしまみれ</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d62828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="すしまみれ">

<style>
body {
  margin: 0;
  background:
    repeating-linear-gradient(
      90deg,
      #f3d6a2 0px,
      #f3d6a2 24px,
      #e8c489 24px,
      #e8c489 48px
    );
  font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
  text-align: center;
  user-select: none;
}

h1 {
  display: inline-block;
  margin: 8px 0 4px;
  padding: 8px 28px;
  font-size: 34px;
  color: #fff;
  background: #d62828;
  border: 4px solid #8b1e1e;
  border-radius: 0 0 22px 22px;
  box-shadow: 0 5px 0 #7a1b1b;
  letter-spacing: 6px;
}

#score,
#highScore,
#next {
  font-family: sans-serif;
  font-weight: bold;
  color: #3a2416;
  margin: 4px 0;
}

#score {
  font-size: 21px;
}

#highScore,
#next {
  font-size: 16px;
}

#nextPreview {
  display: block;
  margin: 4px auto 6px;
  border: 4px solid #5b3924;
  border-radius: 50%;
  background: rgba(255,255,255,0.75);
  box-shadow: 0 4px 0 #3a2416;
}
#game {
  width: 78vw;
max-width: 420px;
  height: auto;

  background:
    linear-gradient(rgba(255,255,255,0.86), rgba(255,255,255,0.86)),
    repeating-linear-gradient(
      45deg,
      #fff8ec 0px,
      #fff8ec 16px,
      #ffe8c2 16px,
      #ffe8c2 32px
    );

  border: 6px solid #5b3924;
  border-radius: 20px;
  display: block;
  margin: 8px auto 0;
  touch-action: none;
  box-shadow:
    0 8px 0 #3a2416,
    0 14px 24px rgba(0,0,0,0.25);
}
#evolutionTitle {
  font-family: sans-serif;
  font-weight: bold;
  margin-top: 6px;
  color: #3a2416;
}

#evolutionList {
  display: flex;
  justify-content: center;
  gap: 4px;
  flex-wrap: wrap;
  margin: 4px auto 6px;
  max-width: 520px;
  font-family: sans-serif;
}

.evoItem {
  font-size: 11px;
  background: rgba(255,255,255,0.75);
  border: 2px solid #5b3924;
  border-radius: 10px;
  padding: 3px 5px;
}
.evoIcon {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  object-fit: cover;
  vertical-align: middle;
  margin-right: 3px;
}
</style>
</head>
<body>
  <h1>すしまみれ</h1>
  <div id="score">売上: 0円</div>
  <div id="highScore">最高売上: 0円</div>
  <div id="current">今のネタ</div>
  <div id="next">次のネタ</div>
  <canvas id="nextPreview" width="90" height="90"></canvas>
  <div id="evolutionTitle">進化順</div>
  <div id="evolutionList"></div>
  <canvas id="game"></canvas>

  <script>
   const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  const w = Math.min(window.innerWidth * 0.78, 420);
  canvas.width = w;
  canvas.height = w * 1.45;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("highScore");;
    const nextEl = document.getElementById("next");
    const currentEl = document.getElementById("current");
    const nextPreview = document.getElementById("nextPreview");
    const nextCtx = nextPreview.getContext("2d");

    const sushiList = [
      { name: "たまご", img: "tamago.png", r: 28, color: "#ffd84d", score: 10, weight: 0.85 },
{ name: "いなり", img: "inari.png", r: 34, color: "#c47a2c", score: 30, weight: 0.95 },
{ name: "かっぱ巻き", img: "kappa.png", r: 40, color: "#7ac943", score: 60, weight: 1.05 },
{ name: "鉄火巻き", img: "tekkamaki.png", r: 46, color: "#d62828", score: 100, weight: 1.15 },
{ name: "えび", img: "ebi.png", r: 52, color: "#ff9f80", score: 160, weight: 1.3 },
{ name: "いくら軍艦", img: "ikura.png", r: 60, color: "#ff3b3b", score: 240, weight: 1.45 },
{ name: "うに軍艦", img: "uni.png", r: 68, color: "#f7b801", score: 350, weight: 1.6 },
{ name: "マグロ", img: "maguro.png", r: 78, color: "#d90429", score: 500, weight: 1.8 },
{ name: "大トロ", img: "otoro.png", r: 92, color: "#ffcad4", score: 1000, weight: 2.0 },
{ name: "寿司桶", img: "oke.png", r: 110, color: "#8ecae6", score: 2000, weight: 2.4 }
    ];

    const sushiImages = {};
    for (let sushi of sushiList) {
  const image = new Image();
  image.onload = () => {
    drawNextPreview();
  };
  image.src = "sushi-images/" + sushi.img;
  sushiImages[sushi.img] = image;
}
const evolutionList = document.getElementById("evolutionList");

function renderEvolutionList() {
  evolutionList.innerHTML = sushiList
    .map((s, i) => `
      <span class="evoItem">
        <img class="evoIcon" src="sushi-images/${s.img}">
        ${i + 1}. ${s.name}
      </span>
    `)
    .join(" → ");
}
    let sushis = [];
    let currentType = Math.floor(Math.random() * 3);
    let nextType = Math.floor(Math.random() * 3);
    let mouseX = canvas.width / 2;
    let score = 0;
    let highScore = localStorage.getItem("sushimamireHighScore") || 0;
    let gameOver = false;
    let message = "";
    let effectX = 0;
    let effectY = 0;
    let effectTime = 0;
    let dangerCount = 0;

    highScoreEl.textContent = "最高売上: " + highScore + "円";

    function playMergeSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(660, audioCtx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(990, audioCtx.currentTime + 0.08);

      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

      oscillator.connect(gain);
      gain.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.12);
    }

   function updateSushiText() {
  currentEl.textContent = "今のネタ: " + sushiList[currentType].name;
  nextEl.textContent = "次のネタ: " + sushiList[nextType].name;
}

    function drawNextPreview() {
      if (!nextCtx || !sushiList || !sushiList[currentType]) return;

      nextCtx.clearRect(0, 0, 90, 90);

      const s = sushiList[currentType];
      const img = sushiImages[s.img];

      nextCtx.beginPath();
      nextCtx.arc(45, 45, 35, 0, Math.PI * 2);
      nextCtx.fillStyle = s.color;
      nextCtx.fill();
      nextCtx.strokeStyle = "#5b3924";
      nextCtx.lineWidth = 3;
      nextCtx.stroke();

      nextEl.textContent = "次のネタ: " + s.name;

      if (img && img.complete) {
        nextCtx.save();
        nextCtx.beginPath();
        nextCtx.arc(45, 45, 32, 0, Math.PI * 2);
        nextCtx.clip();
        nextCtx.drawImage(img, 10, 10, 70, 70);
        nextCtx.restore();
      }
    }

    function createSushi(x, y, type) {
      const s = sushiList[type];
      return {
        x,
        y,
        vx: 0,
        vy: 0,
        type,
        r: s.r,
        weight: s.weight,
        merged: false
      };
    }

    function drawSushi(ball) {
      const s = sushiList[ball.type];
      const img = sushiImages[s.img];

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.fill();
      ctx.strokeStyle = "#5b3924";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r - 3, 0, Math.PI * 2);
      ctx.clip();

      if (img && img.complete && img.naturalWidth > 0) {
  ctx.drawImage(
    img,
    ball.x - ball.r,
    ball.y - ball.r,
    ball.r * 2,
    ball.r * 2
  );
}

      ctx.restore();
    }

    function drawPreview() {
      const s = sushiList[currentType];
      const img = sushiImages[s.img];

      ctx.beginPath();
      ctx.arc(mouseX, 42, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = 0.65;
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.strokeStyle = "#5b3924";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.arc(mouseX, 42, s.r - 3, 0, Math.PI * 2);
      ctx.clip();

      if (img && img.complete) {
        ctx.drawImage(
          img,
          mouseX - s.r,
          42 - s.r,
          s.r * 2,
          s.r * 2
        );
      }

      ctx.restore();
    }

    function update() {
      if (!gameOver) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#d9534f";
        ctx.fillRect(0, 130, canvas.width, 3);
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillText("ここを超えるとネタ切れ！", canvas.width / 2, 122);

        drawPreview();

        for (let b of sushis) {
         b.vy += 0.032 + b.weight * 0.004;
         if (b.vy > 2.0) b.vy = 2.0;

         b.vx *= 0.82;
         b.vy *= 0.94;

         b.x += b.vx;
         b.y += b.vy;

          if (b.x - b.r < 0) {
            b.x = b.r;
            b.vx *= -0.45;
          }

          if (b.x + b.r > canvas.width) {
            b.x = canvas.width - b.r;
            if (Math.abs(b.vy) < 0.2) b.vy = 0;
            b.vx *= -0.45;
          }

          if (b.y + b.r > canvas.height) {
            b.y = canvas.height - b.r;
            b.vy *= -0.03;
            b.vx *= 0.72;
          }
        }

        for (let i = 0; i < sushis.length; i++) {
          for (let j = i + 1; j < sushis.length; j++) {
            const a = sushis[i];
            const b = sushis[j];

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = a.r + b.r;

            if (dist < minDist * 0.82 && dist > 0) {
              const angle = Math.atan2(dy, dx);
              const overlap = minDist - dist;

              const totalWeight = a.weight + b.weight;
              const aMove = b.weight / totalWeight;
              const bMove = a.weight / totalWeight;

              a.x -= Math.cos(angle) * overlap * aMove;
              a.y -= Math.sin(angle) * overlap * aMove;
              b.x += Math.cos(angle) * overlap * bMove;
              b.y += Math.sin(angle) * overlap * bMove;

              a.vx -= Math.cos(angle) * 0.006;
              a.vy -= Math.sin(angle) * 0.006;
              b.vx += Math.cos(angle) * 0.006;
              b.vy += Math.sin(angle) * 0.006;

              if (
                a.type === b.type &&
                !a.merged &&
                !b.merged &&
                a.type < sushiList.length - 1
              ) {
                a.merged = true;
                b.merged = true;

                const newX = (a.x + b.x) / 2;
                const newY = (a.y + b.y) / 2;
                const newType = a.type + 1;

                sushis.splice(j, 1);
                sushis.splice(i, 1);
                sushis.push(createSushi(newX, newY, newType));

                score += sushiList[newType].score;
                scoreEl.textContent = "売上: " + score + "円";

                effectX = newX;
                effectY = newY;
                effectTime = 15;
                playMergeSound();

                if (score > highScore) {
                  highScore = score;
                  localStorage.setItem("sushimamireHighScore", highScore);
                  highScoreEl.textContent = "最高売上: " + highScore + "円";
                }

                message = "へい、お待ち！";
                setTimeout(() => message = "", 500);
                break;
              }
            }
          }
        }

        for (let b of sushis) {
          b.merged = false;
          drawSushi(b);
        }
         let isDanger = false;

for (let b of sushis) {
  if (
    b.y - b.r < 130 &&
    sushis.length > 8 &&
    Math.abs(b.vy) < 0.5
  ) {
    isDanger = true;
  }
}

if (isDanger) {
  dangerCount++;
} else {
  dangerCount = 0;
}

if (dangerCount > 90) {
  gameOver = true;
}

        if (effectTime > 0) {
          ctx.beginPath();
          ctx.arc(effectX, effectY, 30 - effectTime, 0, Math.PI * 2);
          ctx.strokeStyle = "orange";
          ctx.lineWidth = 4;
          ctx.stroke();

          ctx.font = "24px sans-serif";
          ctx.fillText("✨", effectX, effectY);

          effectTime--;
        }

        if (message) {
          ctx.font = "26px sans-serif";
          ctx.fillStyle = "#d62828";
          ctx.fillText(message, canvas.width / 2, 130);
        }
      }

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.font = "38px sans-serif";
        ctx.fillText("ネタ切れ！", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "18px sans-serif";
        ctx.fillText("タップで再開", canvas.width / 2, canvas.height / 2 + 28);
      }

      requestAnimationFrame(update);
    }

    function movePointer(clientX) {
      const rect = canvas.getBoundingClientRect();
      mouseX = clientX - rect.left;
      mouseX = Math.max(25, Math.min(canvas.width - 25, mouseX));
    }

    canvas.addEventListener("mousemove", e => {
      movePointer(e.clientX);
    });

    canvas.addEventListener("touchmove", e => {
      movePointer(e.touches[0].clientX);
      e.preventDefault();
    }, { passive: false });

   canvas.addEventListener("pointerup", dropSushi);

    function dropSushi() {
      if (gameOver) {
        sushis = [];
        score = 0;
        gameOver = false;
        scoreEl.textContent = "売上: 0円";
        currentType = nextType;
        nextType = Math.floor(Math.random() * 3);
        updateSushiText();
        drawNextPreview();
        return;
      }

      sushis.push(createSushi(mouseX, 42, currentType));
      currentType = Math.floor(Math.random() * 5);
      updateSushiText();
      drawNextPreview();
      update();
    }

   renderEvolutionList();
drawNextPreview();
sushis.push(createSushi(canvas.width / 2, 42, currentType));
update();
  </script>
</body>
</html>
